<html>
	<head>
		<title>Jeu</title>
		<meta charset="UTF-8" />
    	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    	<link rel="stylesheet" href="./styles.css"/>
	</head>
	<body>
		<div class="highButton">
			<button class="position" onclick="createPosition()">Créer le jeu</button>
		</div>
		<div class="settings">
			<h3>Hauteur</h3>
			<div class="slide">
				<input type="range" min="1" max="50" value="1" class="slider slider_height" oninput="majValue(value, 'height')">
				<h4 class="height">1</h4>
			</div>
			<h3>Largeur</h3>
			<div class="slide">
				<input type="range" min="1" max="50" value="1" class="slider slider_width" oninput="majValue(value, 'width')">
				<h4 class="width">1</h4>
			</div>
			<h3>Longueur</h3>
			<div class="slide">
				<input type="range" min="1" max="50" value="1" class="slider slider_length" oninput="majValue(value, 'length')">
				<h4 class="length">1</h4>
			</div>
		</div>
		<div class="tableContainer"></div>
		<dialog class="WIN_begin WIN_general">
			<p class="WINtext_general WINtext_begin">Vous avez gagné !</p>
		</dialog>
		<script src="./code.js"></script>
    	<script src="./state.js"></script>
    	<script src="./html.js"></script>
		<script src="./solve-maze.js"></script>
	</body>
</html>
